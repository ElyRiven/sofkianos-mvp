spring.application.name=producer-api

server.port=8082

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

app.rabbitmq.exchange=kudos.exchange
app.rabbitmq.queue=kudos.queue
app.rabbitmq.routing-key=kudos.key

springdoc.swagger-ui.path=/swagger-ui

# Disable default static resource mappings (API-only service)
spring.web.resources.add-mappings=false

# JPA / DataSource
spring.datasource.url=${DATASOURCE_URL:jdbc:postgresql://localhost:5432/sofkianos}
spring.datasource.username=${DATASOURCE_USERNAME:postgres}
spring.datasource.password=${DATASOURCE_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
