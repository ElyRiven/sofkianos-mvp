name: Issue Classifier & Bug Scanner

on:
  # Trigger when PR is approved on develop branch
  pull_request_review:
    types: [submitted]
    branches:
      - develop
  # Keep manual issue classification
  issues:
    types: [opened, edited, reopened]

permissions:
  issues: write
  contents: read
  pull-requests: read
  security-events: write

jobs:
  # Job 1: Classify manually created issues (existing functionality)
  classify-issue:
    name: Classify & Label Issue
    if: github.event_name == 'issues'
    runs-on: ubuntu-latest
    steps:
      - name: Apply Labels Based on Issue Title
        uses: actions/github-script@v7
        with:
          script: |
            const title = context.payload.issue.title;
            const labelMap = [
              { prefix: '[Bug]:',        labels: ['bug'] },
              { prefix: '[Tech Debt]:',  labels: ['tech-debt'] },
              { prefix: '[Security]:',   labels: ['security', 'critical'] },
            ];
            const match = labelMap.find(({ prefix }) => title.startsWith(prefix));
            if (match) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                labels: match.labels,
              });
            }

  # Job 2: Automated bug scanning on PR approval
  scan-and-create-issues:
    name: SonarCloud Scan & Issue Creation
    if: github.event_name == 'pull_request_review' && github.event.review.state == 'approved'
    runs-on: ubuntu-latest
    env:
      SONAR_HOST_URL: https://sonarcloud.io
      SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
    strategy:
      matrix:
        include:
          - app: frontend
            label: frontend
            baseDir: frontend
            projectKey: ${{ vars.SONAR_FRONTEND_PROJECT_KEY != '' && vars.SONAR_FRONTEND_PROJECT_KEY || 'sofkianos-frontend' }}
            sources: src
            needsNode: true
            build: ""
          - app: producer-api
            label: producer-api
            baseDir: producer-api
            projectKey: ${{ vars.SONAR_PRODUCER_PROJECT_KEY != '' && vars.SONAR_PRODUCER_PROJECT_KEY || 'sofkianos-producer-api' }}
            sources: src/main/java
            needsNode: false
            build: "./mvnw -B -DskipTests compile"
          - app: consumer-worker
            label: consumer-worker
            baseDir: consumer-worker
            projectKey: ${{ vars.SONAR_CONSUMER_PROJECT_KEY != '' && vars.SONAR_CONSUMER_PROJECT_KEY || 'sofkianos-consumer-worker' }}
            sources: src/main/java
            needsNode: false
            build: "./mvnw -B -DskipTests compile"
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js
        if: matrix.needsNode == true
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate SonarCloud configuration
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "${SONAR_TOKEN}" ]; then
            echo "SONAR_TOKEN secret is required to run SonarCloud analysis."
            exit 1
          fi

          if [ -z "${SONAR_ORGANIZATION}" ]; then
            echo "Set repository variable SONAR_ORGANIZATION with your SonarCloud organization key."
            exit 1
          fi

          if [ -z "${{ matrix.projectKey }}" ]; then
            echo "Project key for ${{ matrix.app }} is missing. Configure SONAR_<APP>_PROJECT_KEY repository variable."
            exit 1
          fi

      - name: Install frontend dependencies
        if: matrix.needsNode == true
        working-directory: ${{ matrix.baseDir }}
        run: |
          npm install --no-audit --no-fund --no-package-lock

      - name: Build Java project
        if: matrix.build != ''
        working-directory: ${{ matrix.baseDir }}
        run: ${{ matrix.build }}

      - name: Run SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@v2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: ${{ matrix.baseDir }}
          args: >
            -Dsonar.host.url=${{ env.SONAR_HOST_URL }}
            -Dsonar.organization=${{ env.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ matrix.projectKey }}
            -Dsonar.sources=${{ matrix.sources }}
            -Dsonar.pullrequest.key=${{ github.event.pull_request.number }}
            -Dsonar.pullrequest.branch=${{ github.event.pull_request.head.ref }}
            -Dsonar.pullrequest.base=${{ github.event.pull_request.base.ref }}
            -Dsonar.scm.revision=${{ github.event.pull_request.head.sha || github.sha }}

      - name: Create GitHub issues from SonarCloud findings
        uses: actions/github-script@v7
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ env.SONAR_HOST_URL }}
          SONAR_PROJECT_KEY: ${{ matrix.projectKey }}
          APP_LABEL: ${{ matrix.label }}
          APP_PROJECT: ${{ matrix.projectKey }}
        with:
          script: |
            const fetchIssuesFromSonar = async () => {
              const params = new URLSearchParams({
                projects: process.env.SONAR_PROJECT_KEY,
                types: 'BUG',
                severities: 'BLOCKER,CRITICAL,MAJOR',
                ps: '100'
              });

              const prNumber = context.payload.pull_request?.number;
              const branch = context.payload.pull_request?.head?.ref || process.env.GITHUB_REF_NAME;

              if (prNumber) {
                params.append('pullRequest', `${prNumber}`);
              } else if (branch) {
                params.append('branch', branch);
              }

              const response = await fetch(`${process.env.SONAR_HOST_URL}/api/issues/search?${params.toString()}`, {
                headers: {
                  Authorization: `Basic ${Buffer.from(`${process.env.SONAR_TOKEN}:`).toString('base64')}`
                }
              });

              if (!response.ok) {
                throw new Error(`SonarQube search failed: ${response.status} ${await response.text()}`);
              }

              const payload = await response.json();
              return payload.issues || [];
            };

            const sonarIssues = await fetchIssuesFromSonar();

            if (sonarIssues.length === 0) {
              console.log('No SonarQube issues found for this analysis.');
              return;
            }

            const existingIssues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: `automated-scan,sonarcloud,${process.env.APP_LABEL}`,
              per_page: 100
            });

            const created = [];
            const commitSha = context.payload.pull_request?.head?.sha || context.sha;
            const workflowUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const maxIssues = 20;

            for (const issue of sonarIssues) {
              if (created.length >= maxIssues) {
                console.log('Reached issue creation limit, skipping remaining findings.');
                break;
              }

              const sonarKey = issue.key;
              const duplicate = existingIssues.some(existing => (existing.body || '').includes(`sonar-issue-key:${sonarKey}`));

              if (duplicate) {
                console.log(`Issue for Sonar key ${sonarKey} already exists, skipping.`);
                continue;
              }

              const component = issue.component?.includes(':') ? issue.component.split(':')[1] : (issue.component || 'Unknown file');
              const line = issue.line || issue.textRange?.startLine || 'N/A';
              const rule = issue.rule || 'N/A';
              const severity = issue.severity || 'MAJOR';
              const description = issue.message || 'See SonarQube for details.';
              const sonarLink = `${process.env.SONAR_HOST_URL}/project/issues?id=${encodeURIComponent(process.env.SONAR_PROJECT_KEY)}&issues=${encodeURIComponent(sonarKey)}`;
              const title = `🐛 SonarQube: ${rule} in ${component}`;

              const body = [
                '## 🐛 Bug Detected by SonarQube',
                '',
                `**Severity:** \`${severity}\`  `,
                '**Type:** `BUG`  ',
                `**Rule:** \`${rule}\``,
                '',
                '### 📍 Location',
                `- **File:** \`${component}\``,
                `- **Line:** ${line}`,
                `- **Project:** ${process.env.APP_PROJECT}`,
                '',
                '### 📝 Description',
                description,
                '',
                '### 🔗 Links',
                `- <a href="${sonarLink}">View in SonarQube</a>`,
                '',
                '---',
                '',
                `**Auto-generated from SonarQube analysis on commit:** \`${commitSha}\`  `,
                `**Workflow run:** ${workflowUrl}`,
                '',
                `<!-- sonar-issue-key:${sonarKey} -->`
              ].join('\n');

              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['bug', 'automated-scan', 'sonarcloud', process.env.APP_LABEL]
              });

              console.log(`Created issue for ${component} (rule ${rule})`);
              created.push(sonarKey);
            }

            console.log(`Created ${created.length} GitHub issue(s) from SonarQube findings.`);

      - name: Summary Comment on PR
        if: matrix.app == 'frontend'
        uses: actions/github-script@v7
        with:
          script: |
            const issuesUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/issues?q=is%3Aissue+is%3Aopen+label%3Asonarcloud`;
            const comment = [
              '## 🔍 Automated SonarCloud Scan Completed',
              '',
              'SonarCloud analysis ran on all applications in this repository:',
              '',
              '- ✅ **frontend**',
              '- ✅ **producer-api**',
              '- ✅ **consumer-worker**',
              '',
              `New issues (label: \`sonarcloud\`) were created for detected bugs. Review them here: [Issues](${issuesUrl}).`,
              '',
              '**Note**: Issue creation is limited to the most important findings to avoid noise.'
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: comment
            });
