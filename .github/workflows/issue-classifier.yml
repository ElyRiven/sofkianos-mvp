name: Issue Classifier & Bug Scanner

on:
  # Trigger when PR is approved on develop branch
  pull_request_review:
    types: [submitted]
    branches:
      - develop
  # Keep manual issue classification
  issues:
    types: [opened, edited, reopened]

permissions:
  issues: write
  contents: read
  pull-requests: read
  security-events: write

jobs:
  # Job 1: Classify manually created issues (existing functionality)
  classify-issue:
    name: Classify & Label Issue
    if: github.event_name == 'issues'
    runs-on: ubuntu-latest
    steps:
      - name: Apply Labels Based on Issue Title
        uses: actions/github-script@v7
        with:
          script: |
            const title = context.payload.issue.title;
            const labelMap = [
              { prefix: '[Bug]:',        labels: ['bug'] },
              { prefix: '[Tech Debt]:',  labels: ['tech-debt'] },
              { prefix: '[Security]:',   labels: ['security', 'critical'] },
            ];
            const match = labelMap.find(({ prefix }) => title.startsWith(prefix));
            if (match) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                labels: match.labels,
              });
            }

  # Job 2: Automated bug scanning on PR approval
  scan-and-create-issues:
    name: Scan Project & Create Issues
    if: github.event_name == 'pull_request_review' && github.event.review.state == 'approved'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # ========================================================================
      # BACKEND ANALYSIS (SpotBugs + PMD)
      # ========================================================================
      - name: Run SpotBugs on Producer API
        working-directory: ./producer-api
        continue-on-error: true
        run: |
          ./mvnw compile spotbugs:spotbugs -Dspotbugs.failOnError=false
          
      - name: Run SpotBugs on Consumer Worker
        working-directory: ./consumer-worker
        continue-on-error: true
        run: |
          ./mvnw compile spotbugs:spotbugs -Dspotbugs.failOnError=false

      # ========================================================================
      # FRONTEND ANALYSIS (ESLint)
      # ========================================================================
      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run ESLint
        working-directory: ./frontend
        continue-on-error: true
        run: |
          npm run lint -- --format json --output-file eslint-report.json
          
      - name: Upload ESLint Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eslint-report
          path: frontend/eslint-report.json
          retention-days: 1

      # ========================================================================
      # SECURITY ANALYSIS (CodeQL)
      # ========================================================================
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java-kotlin, javascript-typescript
          queries: security-and-quality

      - name: Build Backend for CodeQL
        working-directory: ./producer-api
        run: ./mvnw clean package -DskipTests

      - name: Build Frontend for CodeQL
        working-directory: ./frontend
        run: npm run build

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "full-project-scan"
          upload: true

      # ========================================================================
      # PARSE RESULTS & CREATE ISSUES
      # ========================================================================
      - name: Parse ESLint Results and Create Issues
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = './frontend/eslint-report.json';
            
            if (!fs.existsSync(path)) {
              console.log('No ESLint report found, skipping...');
              return;
            }
            
            const results = JSON.parse(fs.readFileSync(path, 'utf8'));
            const issues = [];
            
            for (const file of results) {
              if (file.errorCount === 0 && file.warningCount === 0) continue;
              
              for (const message of file.messages) {
                // Only create issues for errors, not warnings
                if (message.severity !== 2) continue;
                
                const issueKey = `${file.filePath}:${message.line}:${message.ruleId}`;
                
                // Check if similar issue already exists
                const existing = issues.find(i => i.key === issueKey);
                if (existing) continue;
                
                const severity = message.severity === 2 ? '🟠 Major' : '🟡 Minor';
                const fileName = require('path').basename(file.filePath);
                const issueTitle = `[Bug]: ESLint - ${message.ruleId} in ${fileName}`;
                const issueBody = [
                  '## 🐛 Bug Report',
                  '',
                  '**📋 Description**',
                  'ESLint detected a code quality issue in the frontend codebase.',
                  '',
                  '**🔁 Steps to Reproduce**',
                  `1. Open file: ${file.filePath}`,
                  `2. Go to line ${message.line}, column ${message.column}`,
                  `3. Observe the issue: ${message.message}`,
                  '',
                  '**✅ Expected Results**',
                  'The code should follow ESLint rules and best practices.',
                  '',
                  '**❌ Actual Results**',
                  `ESLint rule "${message.ruleId}" is violated.`,
                  '',
                  '**🚨 Severity Level**',
                  `${severity} — Code quality issue`,
                  '',
                  '**🔍 Validation**',
                  '- **Confirmed by**: ESLint automated scan',
                  '- **Environment**: Source code',
                  `- **Rule**: ${message.ruleId}`,
                  `- **File**: ${file.filePath}`,
                  `- **Line**: ${message.line}:${message.column}`,
                  '',
                  '**📁 Affected Files / Components**',
                  `${file.filePath}`,
                  '',
                  '**💡 Proposed Solution**',
                  message.fix ? 'Auto-fix available via ESLint' : 'Manual fix required',
                  message.ruleId ? `See: https://eslint.org/docs/rules/${message.ruleId}` : ''
                ].filter(line => line !== undefined).join('\n');

                issues.push({
                  key: issueKey,
                  title: issueTitle,
                  body: issueBody,
                  labels: ['bug', 'automated-scan', 'frontend']
                });
              }
            }
            
            console.log(`Found ${issues.length} ESLint issues to create`);
            
            // Create issues (limit to 10 to avoid spam)
            for (const issue of issues.slice(0, 10)) {
              try {
                await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title: issue.title,
                  body: issue.body,
                  labels: issue.labels
                });
                console.log(`Created issue: ${issue.title}`);
              } catch (error) {
                console.error(`Failed to create issue: ${error.message}`);
              }
            }
            
            if (issues.length > 10) {
              console.log(`Note: ${issues.length - 10} additional issues were found but not created to avoid spam.`);
            }

      - name: Process CodeQL Results and Create Issues
        uses: actions/github-script@v7
        with:
          script: |
            // Fetch CodeQL alerts for this repository
            try {
              const alerts = await github.rest.codeScanning.listAlertsForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'open',
                per_page: 100
              });
              
              console.log(`Found ${alerts.data.length} open CodeQL alerts`);
              
              // Group alerts by severity
              const criticalAlerts = alerts.data.filter(a => a.rule.security_severity_level === 'critical' || a.rule.severity === 'error');
              const majorAlerts = alerts.data.filter(a => a.rule.security_severity_level === 'high' || a.rule.severity === 'warning');
              
              // Create issues for critical security findings (limit to 5)
              for (const alert of criticalAlerts.slice(0, 5)) {
                const isSecurityIssue = alert.rule.security_severity_level != null;
                const issueTitle = isSecurityIssue 
                  ? `[Security]: ${alert.rule.description}`
                  : `[Bug]: ${alert.rule.description}`;
                
                const severityMap = {
                  'critical': '🔴 Critical',
                  'high': '🟠 Major',
                  'medium': '🟡 Minor',
                  'low': '🟢 Enhancement'
                };
                
                const severity = severityMap[alert.rule.security_severity_level] || '🟠 Major';
                
                const securityBody = [
                  '## 🔴 Security Issue',
                  '',
                  '**📋 Description**',
                  `CodeQL detected a security vulnerability: ${alert.rule.description}`,
                  '',
                  '**🔁 Steps to Reproduce / Verify**',
                  `1. Open file: ${alert.most_recent_instance.location.path}`,
                  `2. Review line ${alert.most_recent_instance.location.start_line}`,
                  `3. Examine the code for: ${alert.rule.name}`,
                  '',
                  '**✅ Expected (Secure) Behaviour**',
                  alert.rule.help || 'Code should follow security best practices',
                  '',
                  '**❌ Actual (Vulnerable) Behaviour**',
                  alert.most_recent_instance.message.text,
                  '',
                  '**🚨 Severity Level**',
                  `${severity} — Security vulnerability detected`,
                  '',
                  '**🔍 Validation**',
                  '- **Confirmed by**: CodeQL automated security scan',
                  '- **Environment**: Source code',
                  `- **Alert Number**: #${alert.number}`,
                  `- **File**: ${alert.most_recent_instance.location.path}`,
                  `- **Line**: ${alert.most_recent_instance.location.start_line}`,
                  '',
                  '**📁 Affected Files / Components**',
                  alert.most_recent_instance.location.path,
                  '',
                  '**💡 Proposed Long-Term Solution**',
                  alert.rule.help_uri ? `See CodeQL documentation: ${alert.rule.help_uri}` : 'Review and apply security best practices'
                ].join('\n');
                
                const bugBody = [
                  '## 🐛 Bug Report',
                  '',
                  '**📋 Description**',
                  `CodeQL detected a code quality issue: ${alert.rule.description}`,
                  '',
                  '**🔁 Steps to Reproduce**',
                  `1. Open file: ${alert.most_recent_instance.location.path}`,
                  `2. Go to line ${alert.most_recent_instance.location.start_line}`,
                  `3. Review: ${alert.most_recent_instance.message.text}`,
                  '',
                  '**✅ Expected Results**',
                  alert.rule.help || 'Code should follow best practices',
                  '',
                  '**❌ Actual Results**',
                  alert.most_recent_instance.message.text,
                  '',
                  '**🚨 Severity Level**',
                  severity,
                  '',
                  '**🔍 Validation**',
                  '- **Confirmed by**: CodeQL scan',
                  `- **File**: ${alert.most_recent_instance.location.path}`,
                  `- **Line**: ${alert.most_recent_instance.location.start_line}`,
                  '',
                  '**📁 Affected Files / Components**',
                  alert.most_recent_instance.location.path
                ].join('\n');
                
                const issueBody = isSecurityIssue ? securityBody : bugBody;

                try {
                  const labels = isSecurityIssue 
                    ? ['security', 'critical', 'automated-scan']
                    : ['bug', 'automated-scan'];
                    
                  await github.rest.issues.create({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    title: issueTitle,
                    body: issueBody,
                    labels: labels
                  });
                  console.log(`Created issue: ${issueTitle}`);
                } catch (error) {
                  console.error(`Failed to create issue: ${error.message}`);
                }
              }
              
              console.log(`Processed ${Math.min(criticalAlerts.length, 5)} critical alerts`);
              
            } catch (error) {
              console.error(`Error fetching CodeQL alerts: ${error.message}`);
            }

      - name: Create Issues from SonarCloud Findings
        uses: actions/github-script@v7
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: ElyRiven_sofkianos-mvp
          SONAR_DEFAULT_BRANCH: develop
        with:
          script: |
            const fs = require('fs');
            const projectKey = process.env.SONAR_PROJECT_KEY || 'ElyRiven_sofkianos-mvp';
            const branch = process.env.SONAR_BRANCH || context.payload.pull_request?.head?.ref || process.env.SONAR_DEFAULT_BRANCH || 'develop';
            const severityFilter = new Set(['BLOCKER', 'CRITICAL', 'MAJOR']);
            const baseUrl = 'https://sonarcloud.io';
            
            if (!process.env.SONAR_TOKEN) {
              console.log('SONAR_TOKEN is not configured. Skipping SonarCloud issue creation.');
              return;
            }
            
            const authHeader = `Basic ${Buffer.from(`${process.env.SONAR_TOKEN}:`).toString('base64')}`;
            const fetchPage = async (pageIndex) => {
              const searchUrl = `${baseUrl}/api/issues/search?componentKeys=${encodeURIComponent(projectKey)}&types=BUG&statuses=OPEN&ps=100&p=${pageIndex}&branch=${encodeURIComponent(branch)}`;
              const response = await fetch(searchUrl, { headers: { Authorization: authHeader } });
              
              if (!response.ok) {
                const message = await response.text();
                throw new Error(`SonarCloud API request failed (${response.status}): ${message}`);
              }
              
              return response.json();
            };
            
            let page = 1;
            const sonarIssues = [];
            
            while (true) {
              const data = await fetchPage(page);
              sonarIssues.push(...(data.issues || []));
              
              const pageSize = data.paging?.pageSize ?? 0;
              const total = data.paging?.total ?? 0;
              
              if (pageSize === 0 || page * pageSize >= total) {
                break;
              }
              
              page += 1;
            }
            
            const filteredIssues = sonarIssues.filter(issue => severityFilter.has(issue.severity));
            
            if (!filteredIssues.length) {
              console.log('No SonarCloud issues to process.');
              return;
            }
            
            const existingIssues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'sonarcloud,automated-scan',
              state: 'open',
              per_page: 100
            });
            
            const existingKeys = new Set();
            for (const issue of existingIssues) {
              const match = issue.body?.match(/SonarCloud Issue Key:\s*([A-Z0-9_-]+)/i);
              if (match?.[1]) {
                existingKeys.add(match[1]);
              }
            }
            
            const templatePath = '.github/ISSUE_TEMPLATE/sonarcloud-auto-bug.md';
            const defaultTemplate = `
# 🐛 SonarCloud Automated Bug

## 🐛 Description
{{DESCRIPTION}}

## 🔍 Location
- **Sonar Issue Key**: {{ISSUE_KEY}}
- **Rule**: {{RULE}}
- **Severity**: {{SEVERITY}}
- **File**: {{FILE_PATH}}
- **Line**: {{LINE}}
- **Branch**: {{BRANCH}}
- **Link**: {{SONAR_LINK}}

## ✅ Expected Behaviour
Code complies with the referenced SonarCloud rule and passes the quality gate.

## ❌ Detected Behaviour
{{MESSAGE}}

## 🧪 Validation
- Detected by: SonarCloud analysis
- Project: {{PROJECT_KEY}}
- Scope: Static analysis

## 💡 Proposed Fix
Review the rule guidance and refactor the code to satisfy the quality gate.
`.trim();
            
            let template = fs.existsSync(templatePath)
              ? fs.readFileSync(templatePath, 'utf8')
              : defaultTemplate;
            
            template = template.replace(/^---[\s\S]*?---\s*/, '').trim();
            
            const severityMap = {
              BLOCKER: '🔴 Blocker',
              CRITICAL: '🟠 Critical',
              MAJOR: '🟡 Major',
              MINOR: '🟢 Minor',
              INFO: 'ℹ️ Info'
            };
            
            const fillTemplate = (tpl, data) => tpl
              .replaceAll('{{DESCRIPTION}}', data.description)
              .replaceAll('{{ISSUE_KEY}}', data.key)
              .replaceAll('{{RULE}}', data.rule)
              .replaceAll('{{SEVERITY}}', data.severity)
              .replaceAll('{{FILE_PATH}}', data.filePath)
              .replaceAll('{{LINE}}', data.line)
              .replaceAll('{{BRANCH}}', data.branch)
              .replaceAll('{{SONAR_LINK}}', data.link)
              .replaceAll('{{MESSAGE}}', data.message)
              .replaceAll('{{PROJECT_KEY}}', data.projectKey);
            
            const issuesToCreate = [];
            for (const sonarIssue of filteredIssues) {
              if (existingKeys.has(sonarIssue.key)) {
                continue;
              }
              
              const filePath = sonarIssue.component?.split(':').pop() || 'N/A';
              const line = sonarIssue.textRange?.startLine
                ? `${sonarIssue.textRange.startLine}`
                : 'N/A';
              const severityLabel = severityMap[sonarIssue.severity] || sonarIssue.severity;
              const ruleName = sonarIssue.rule || 'Unspecified rule';
              const issueTitle = `[Bug]: SonarCloud ${ruleName} in ${filePath}`;
              const issueLink = `${baseUrl}/project/issues?id=${encodeURIComponent(projectKey)}&issues=${sonarIssue.key}&open=${sonarIssue.key}&branch=${encodeURIComponent(branch)}`;
              
              const issueBody = fillTemplate(template, {
                description: sonarIssue.message || 'SonarCloud detected a code quality issue.',
                key: sonarIssue.key,
                rule: sonarIssue.rule || 'N/A',
                severity: severityLabel,
                filePath,
                line,
                branch,
                link: issueLink,
                message: sonarIssue.message || 'Refer to SonarCloud for additional context.',
                projectKey
              });
              
              issuesToCreate.push({
                title: issueTitle,
                body: issueBody,
                labels: ['bug', 'automated-scan', 'sonarcloud']
              });
            }
            
            if (!issuesToCreate.length) {
              console.log('All SonarCloud issues already have matching GitHub issues.');
              return;
            }
            
            const limit = 10;
            for (const issue of issuesToCreate.slice(0, limit)) {
              try {
                await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title: issue.title,
                  body: issue.body,
                  labels: issue.labels
                });
                console.log(`Created issue for ${issue.title}`);
              } catch (error) {
                console.error(`Failed to create SonarCloud issue: ${error.message}`);
              }
            }
            
            if (issuesToCreate.length > limit) {
              console.log(`Skipped creating ${issuesToCreate.length - limit} additional issues to avoid spam.`);
            }

      - name: Summary Comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            const issuesUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/issues?q=is%3Aissue+is%3Aopen+label%3Aautomated-scan`;
            const comment = [
              '## 🔍 Automated Bug Scan Completed',
              '',
              'The automated bug scanning workflow has completed. Issues have been created for detected problems:',
              '',
              '- ✅ **ESLint Analysis**: Frontend code quality checked',
              '- ✅ **CodeQL Analysis**: Security and code quality scanned',
              '- ✅ **SpotBugs**: Backend code analysis (if applicable)',
              '- ✅ **SonarCloud**: Static analysis findings converted into tracked issues',
              '',
              `Check the [Issues](${issuesUrl}) tab for automated findings.`,
              '',
              '**Note**: Only the most critical issues are auto-created to avoid spam. Review the Actions artifacts for full reports.'
            ].join('\n');
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: comment
            });
